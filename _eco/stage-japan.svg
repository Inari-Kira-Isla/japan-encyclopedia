<svg viewBox="0 0 500 400" preserveAspectRatio="xMidYMid meet">
            <defs>
              <filter id="washi" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4" result="n"/><feColorMatrix type="matrix" values="0 0 0 0 .55  0 0 0 0 .5  0 0 0 0 .42  0 0 0 .09 0"/><feComposite in2="SourceGraphic" operator="in"/><feBlend in="SourceGraphic" mode="multiply"/></filter>
              <pattern id="seigaiha" width="40" height="20" patternUnits="userSpaceOnUse">
                <g fill="none" stroke="#24476B" stroke-width="1"><circle cx="20" cy="20" r="18"/><circle cx="20" cy="20" r="13"/><circle cx="20" cy="20" r="8"/><circle cx="0" cy="10" r="18"/><circle cx="0" cy="10" r="13"/><circle cx="0" cy="10" r="8"/><circle cx="40" cy="10" r="18"/><circle cx="40" cy="10" r="13"/><circle cx="40" cy="10" r="8"/></g>
              </pattern>
            </defs>
            <rect class="sheet" style="--d:0" x="40" y="30" width="250" height="330" fill="#FBF8F2" filter="url(#washi)"/>
            <rect class="sheet" style="--d:1" x="200" y="70" width="260" height="290" fill="#EAE2D2" filter="url(#washi)"/>
            <rect class="sheet" style="--d:2" x="200" y="250" width="260" height="110" fill="url(#seigaiha)" opacity=".22"/>
            <line class="sheet" style="--d:2" x1="40" y1="300" x2="460" y2="300" stroke="#22201C" stroke-width="1"/>
            <text class="sheet" style="--d:1" x="120" y="70" writing-mode="tb" font-family="Songti TC,Noto Serif TC,serif" font-size="40" fill="#22201C" letter-spacing="12" id="season-book">秋季讀本</text>
            <g class="season-mark"><rect x="380" y="100" width="46" height="46" fill="#A2462A"/><text x="403" y="132" text-anchor="middle" font-family="Songti TC,Noto Serif TC,serif" font-size="26" fill="#F7F4EE" id="season-stamp">秋</text></g>
            <text class="sheet" style="--d:3" x="378" y="172" font-family="system-ui,sans-serif" font-size="11" fill="#5C5850" letter-spacing="2" id="season-month">今季 · 十月</text>
          </svg>